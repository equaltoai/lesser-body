name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CDK_DEFAULT_ACCOUNT: "000000000000"
      CDK_DEFAULT_REGION: "us-east-1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            cdk/go.sum

      - name: Go test
        env:
          GOTOOLCHAIN: auto
        run: go test ./...

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cdk/package-lock.json

      - name: Verify release assets
        run: bash scripts/verify_release_assets.sh v0.0.0-test dist/release-test

      - name: Install CDK dependencies
        working-directory: cdk
        run: npm ci

      - name: CDK synth
        working-directory: cdk
        env:
          GOTOOLCHAIN: auto
        run: ./node_modules/.bin/cdk synth -c app=lesser -c stage=dev -c baseDomain=example.com

      - name: Verify discovery routes
        env:
          GOTOOLCHAIN: auto
        run: bash scripts/check_cdk_discovery_routes.sh
