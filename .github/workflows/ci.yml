name: ci

on:
  pull_request:
  push:
    branches:
      - main
      # Git branch staging is the source-control integration branch,
      # not the CDK/release deploy-stage staging.
      - staging

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CDK_DEFAULT_ACCOUNT: "000000000000"
      CDK_DEFAULT_REGION: "us-east-1"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Go test
        env:
          GOTOOLCHAIN: auto
        run: go test ./...

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cdk/package-lock.json

      - name: Verify release assets
        run: bash scripts/verify_release_assets.sh v0.0.0-test dist/release-test

      - name: Regression check for release manifest checksum coverage
        run: bash scripts/check_release_asset_checksum_regression.sh v0.0.0-test dist/release-test

      - name: Regression check for managed template parameter defaults
        run: bash scripts/check_managed_template_default_regression.sh v0.0.0-test dist/release-test

      - name: Regression check for managed template named resources
        run: bash scripts/check_managed_template_named_resource_regression.sh v0.0.0-test dist/release-test

      - name: Regression check for managed auxiliary assets
        run: bash scripts/check_managed_auxiliary_asset_regression.sh v0.0.0-test dist/release-test

      - name: CDK tests
        working-directory: cdk
        run: npm test

      - name: CDK synth
        working-directory: cdk
        run: npm run synth -- -c app=lesser -c stage=dev -c baseDomain=example.com

      - name: Verify discovery routes
        run: bash scripts/check_cdk_discovery_routes.sh
