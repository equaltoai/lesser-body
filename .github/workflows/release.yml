name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag (example: v1.2.3)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    # Prevent duplicate releases when a workflow_dispatch run creates + pushes a tag.
    if: ${{ github.event_name != 'push' || github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24

      - name: Create and push tag (workflow_dispatch)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_NAME}" != "main" ]]; then
            echo "workflow_dispatch releases must be run from the main branch (got '${GITHUB_REF_NAME}')" >&2
            exit 1
          fi
          if [[ "${RELEASE_VERSION}" != v* ]]; then
            echo "release version must start with 'v' (example: v1.0.0); got '${RELEASE_VERSION}'" >&2
            exit 1
          fi

          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/${RELEASE_VERSION}" >/dev/null; then
            existing_sha="$(git rev-list -n 1 "${RELEASE_VERSION}")"
            if [[ "${existing_sha}" != "${GITHUB_SHA}" ]]; then
              echo "tag '${RELEASE_VERSION}' already exists at ${existing_sha}; refusing to retag ${GITHUB_SHA}" >&2
              exit 1
            fi
            echo "tag '${RELEASE_VERSION}' already exists at ${existing_sha}"
            exit 0
          fi

          git tag "${RELEASE_VERSION}" "${GITHUB_SHA}"
          git push origin "refs/tags/${RELEASE_VERSION}"

      - name: Assert release tag is on main
        run: |
          set -euo pipefail

          git fetch origin main:refs/remotes/origin/main --tags --force
          tagged_sha="$(git rev-list -n 1 "${RELEASE_VERSION}")"
          main_sha="$(git rev-parse origin/main)"

          if ! git merge-base --is-ancestor "${tagged_sha}" origin/main; then
            echo "release tag '${RELEASE_VERSION}' points at ${tagged_sha}, which is not an ancestor of origin/main (${main_sha}); releases must be cut from main" >&2
            exit 1
          fi

      - name: Build release assets
        run: bash scripts/build_release_assets.sh "${RELEASE_VERSION}" dist/release

      - name: Verify release assets
        run: bash scripts/verify_release_assets.sh "${RELEASE_VERSION}" dist/release

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          mapfile -t published_assets < <(bash scripts/list_release_assets.sh dist/release)
          files=()
          for asset in "${published_assets[@]}"; do
            files+=("dist/release/${asset}")
          done

          if gh release view "${RELEASE_VERSION}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_VERSION}" "${files[@]}" --clobber
          else
            gh release create "${RELEASE_VERSION}" "${files[@]}" \
              --title "${RELEASE_VERSION}" \
              --notes "" \
              --verify-tag
          fi
